<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conditionals — AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical, quiet, slightly ominous — a gallery at night that is watching you
   IDEA: the installation's own control terminal; the room itself is the page
   PICTURE: full-bleed 3D room, eleven black rovers on rods, diffused LED faces, lit floor tiles
   COLOUR and TYPE: black field, white ink, colour only ever comes from the LEDs; IBM Plex Mono
   LAYOUT: full-screen canvas, intro card bottom-left, HUD hugging the corners */
:root{color-scheme:dark;--ink:#f2f2f2;--dim:#8d8d8d;--line:rgba(255,255,255,.2)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:15px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#intro{position:fixed;inset:0;display:grid;align-items:end;padding:max(4vw,20px);background:linear-gradient(90deg,rgba(0,0,0,.93) 0%,rgba(0,0,0,.62) 48%,rgba(0,0,0,0) 78%);z-index:6}
.card{max-width:580px}
h1{font-size:clamp(40px,7vw,84px);line-height:1;margin:0 0 16px;font-weight:600;letter-spacing:-.03em}
.lede{font-size:16px;color:#dadada;max-width:48ch;margin:0 0 24px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:12px 18px;min-height:44px;cursor:pointer;border-radius:0}
button.primary{background:var(--ink);color:#000}
button:hover{background:#fff;color:#000}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;background:transparent;color:var(--ink)}
.keys{color:var(--dim);font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:3px 16px;max-width:520px}
.keys b{color:var(--ink);font-weight:400;white-space:nowrap}
#note{color:var(--dim);font-size:13px;margin:16px 0 0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#tl{position:absolute;top:14px;left:14px;font-size:13px;line-height:1.65;background:rgba(0,0,0,.6);padding:10px 14px;border:1px solid var(--line);white-space:pre}
#tr{position:absolute;top:14px;right:14px;display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:58vw}
#tr button{padding:8px 12px;min-height:40px;font-size:13px;background:rgba(0,0,0,.6);border-color:var(--line)}
#tr button:hover{background:#fff;color:#000}
#cue{position:absolute;left:50%;bottom:8vh;transform:translateX(-50%);text-align:center;width:min(92vw,820px);transition:opacity .8s}
#cue .big{font-size:clamp(18px,2.6vw,28px);text-shadow:0 0 22px #000,0 0 6px #000;text-wrap:balance}
#cue .sub{color:#c4c4c4;font-size:14px;margin-top:6px;text-shadow:0 0 12px #000}
#report{position:absolute;right:14px;top:72px;width:min(440px,calc(100vw - 28px));background:rgba(0,0,0,.85);border:1px solid var(--line);padding:16px 18px;font-size:13px;display:none;pointer-events:auto}
#report h2{font-size:18px;margin:0 0 10px;font-weight:600}
#report table{width:100%;border-collapse:collapse}
#report td{padding:4px 0;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.08)}
#report td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
#report p{margin:12px 0 0;color:#cfcfcf}
#joy{position:absolute;left:28px;bottom:28px;width:120px;height:120px;border:1px solid var(--line);border-radius:50%;display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.75)}
#chapter{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:clamp(28px,5vw,58px);font-weight:600;letter-spacing:-.02em;opacity:0;transition:opacity 1.2s;text-shadow:0 0 30px #000,0 0 10px #000}
#chapter small{display:block;font-size:15px;font-weight:400;color:#c4c4c4;margin-top:10px;letter-spacing:0}
#report svg{width:100%;height:96px;display:block;margin-top:12px;border:1px solid rgba(255,255,255,.12)}
#tl,#tr,#cue,#report,#chapter{display:none!important}
.vers{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.vbtn{padding:9px 12px;min-height:40px;font-size:14px;border-color:rgba(255,255,255,.35)}.vbtn.on{background:#fff;color:#000;border-color:#fff}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(255,255,255,.35)}
@media (max-width:600px){#intro{background:linear-gradient(0deg,rgba(0,0,0,.96) 45%,rgba(0,0,0,.2) 85%)}.keys{display:none}#tl{font-size:11px}#tr{max-width:70vw}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="intro"><div class="card">
<h1>Conditionals<br>AR</h1>

<div class="vers"><button class="vbtn on" data-v="V1">V1 Room</button><button class="vbtn" data-v="V2">V2 Corridor</button><button class="vbtn" data-v="V3">V3 Follow</button><button class="vbtn" data-v="V4">V4 Park</button><button class="vbtn" data-v="V5">V5 Guard</button></div>
<div class="btns"><button id="bvr" class="primary">Enter AR</button><button id="bscreen">Enter on screen</button></div>
</div></div>
<div id="hud">
<div id="tl"></div>

<div id="cross"></div><div id="chapter"></div>
<div id="cue"><div class="big"></div><div class="sub"></div></div>
<div id="report"></div>
<div id="joy"><i></i></div>
</div>

  const pool=new THREE.Mesh(new THREE.CircleGeometry(2.4,40),new THREE.MeshBasicMaterial({color:new THREE.Color(.16,.15,.14)}));pool.rotation.x=-Math.PI/2;pool.position.y=0.02;grp.add(pool);

});

[-1.8,1.6].forEach(z=>{const rail=new THREE.Mesh(new THREE.BoxGeometry(ROOM-0.8,0.03,0.035),blackMat);rail.position.set(0,WALL_H-0.03,z);scene.add(rail);});

// ================= tiles =================
const TILES=[
 {name:'VERMILION',c:[214,72,46],cell:[1,1],mode:'walls',face:'X',glyph:'BANG',msg:'ALARM. KEEP YOUR DISTANCE.',desc:'they retreat to the walls',fast:true},

// room from planes: returns {cx,cz,theta,w,d} in the XR reference space
function roomFromPlanes(frame,ref){
  if(!frame.detectedPlanes||frame.detectedPlanes.size===0)return null;

  frame.detectedPlanes.forEach(pl=>{const pose=frame.getPose(pl.planeSpace,ref);if(!pose)return;const m=new THREE.Matrix4().fromArray(pose.transform.matrix);
    const pts=pl.polygon.map(p=>new THREE.Vector3(p.x,p.y,p.z).applyMatrix4(m));
    if(pl.orientation==='horizontal'){const y=pts.reduce((s,p)=>s+p.y,0)/pts.length;const isFloor=pl.semanticLabel==='floor'||(y<0.3&&y>-0.3);if(!isFloor)return;
      let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p.x*q.z-q.x*p.z;}a=Math.abs(a)/2;if(a>floorArea){floorArea=a;floorPts=pts;}}
    else if(pl.orientation==='vertical'){let L=0,ex=0,ez=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];const dx=q.x-p.x,dz=q.z-p.z,l=Math.hypot(dx,dz);if(l>L){L=l;ex=dx;ez=dz;}}
      if(!wallBest||L>wallBest.L)wallBest={L,ex,ez,pts};}});

  return rectFromPoints(src.map(p=>[p.x,p.z]),theta);
}
function rectFromPoints(pts,theta){
  const c=Math.cos(theta),s=Math.sin(theta);let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;

}

const LANE=0.6;
function loopEnds(){return SPACE.hz-0.75;}
function loopLen(){const e=loopEnds();return 4*e+2*Math.PI*LANE;}
function loopPt(u){const e=loopEnds(),L=loopLen();u=((u%L)+L)%L;
  if(u<2*e)return {x:LANE,z:e-u,yaw:Math.PI};u-=2*e;
  const arc=Math.PI*LANE;if(u<arc){const a=u/LANE;return {x:LANE*Math.cos(a),z:-e-LANE*Math.sin(a),yaw:Math.PI+a};}u-=arc;
  if(u<2*e)return {x:-LANE,z:-e+u,yaw:0};u-=2*e;

function nearestU(x,z){let best=0,bd=1e9;const L=loopLen();for(let u=0;u<L;u+=0.08){const p=loopPt(u);const d=Math.hypot(p.x-x,p.z-z);if(d<bd){bd=d;best=u;}}return best;}

function updCorridor(dt){
  const inside=inSpace(player,0.1);const cls=player.cls;MS.st=(MS.st||0)+dt;
  const go=(s,t=0)=>{MS.state=s;MS.st=t;};
  if(!inside&&MS.state!=='empty'){ACTIVE.forEach((r,k)=>{if(dist(r,player)<5)emo(r,'SMILE',WARM,1.5);r.u=nearestU(r.x,r.z);});go('empty');}
  if(MS.state==='empty'&&inside){go('greet');const near=[...ACTIVE].sort((a,b)=>dist(a,player)-dist(b,player));near.slice(0,4).forEach((r,k)=>{emo(r,'SMILE',WARM,2.2);say(r,'hello',k*0.18);r.flash=1;});}
  if(MS.state==='greet'&&MS.st>1.9){startBlock(false);}
  if(MS.state==='block'){
    MS.gz=clamp(player.z+MS.dir*1.5,-SPACE.hz+0.4,SPACE.hz-0.4);
    const push=(cls==='fast'||cls==='mid')&&MS.dir*(MS.gz-player.z)<1.2;
    if(cls==='fast'||push){if(!MS.angry){MS.blockers.forEach((r,k)=>say(r,'angry',k*0.1));}MS.angry=1.8;MS.calm=0;}
    MS.angry=Math.max(0,(MS.angry||0)-dt);MS.calm=(cls==='slow'||cls==='still')?(MS.calm||0)+dt:0;
    if(MS.st>3&&MS.calm>1.6&&MS.angry<=0){go('giveway');MS.blockers.forEach((r,k)=>{emo(r,'JOY',WARM,2);say(r,'happy',k*0.12);r.flash=1;});}
    if(MS.dir*(player.z-MS.gz)>0.3)go('giveway');
  }
  if(MS.state==='giveway'){if(MS.dir*(player.z-MS.gz)>0.9||MS.st>8){go('cool');ACTIVE.forEach(r=>r.u=nearestU(r.x,r.z));}}
  if(MS.state==='cool'&&MS.st>2&&cls==='fast')startBlock(true);
  if(MS.state==='cool'&&MS.st>14&&cls!=='still')startBlock(false);
  // targets & faces
  const toward=(r)=>{r.vis=player;};
  for(const r of ACTIVE){
    let face='NEUTRAL',col=WHITE,fast=false;
    if(MS.state==='empty'||MS.state==='cool'){r.u+=0.36*dt;const p=loopPt(r.u+0.35);r.tx=p.x;r.tz=p.z;r.maxS=0.5;r.vis=dist(r,player)<3.5&&inside?player:{x:r.tx,z:r.tz};if(MS.state==='cool'&&dist(r,player)<3)face='SMILE',col=WARM;}
    else if(MS.state==='greet'){r.tx=r.x;r.tz=r.z;toward(r);face='SMILE';col=WARM;r.maxS=0.5;}
    else if(MS.state==='block'||MS.state==='giveway'){toward(r);
      if(!MS.blockers.includes(r)){const side=r.x>=0?1:-1;r.tx=side*(SPACE.hx-0.33);r.tz=clamp(r.z,-SPACE.hz+0.4,SPACE.hz-0.4);if(Math.abs(r.z-player.z)<0.9)r.tz=player.z-MS.dir*1.0;face=MS.state==='giveway'?'SMILE':'NEUTRAL';col=MS.state==='giveway'?WARM:WHITE;r.maxS=0.6;}}
    r.style=sty(face,col,{fast});
  }
  if(MS.state==='block'){const n=MS.blockers.length,W=2*SPACE.hx-0.66;MS.blockers.forEach((r,k)=>{r.tx=-W/2+W*k/Math.max(1,n-1);r.tz=MS.gz;r.maxS=1.0;r.style=MS.angry>0?sty('ANGRY',REDC,{fast:true,mode:'angry'}):sty(MS.st<1.4?'GRIM':'QUESTION',MS.st<1.4?COOL:WHITE,{fast:true});});}
  if(MS.state==='giveway'){MS.blockers.forEach(r=>{const side=r.x>=0?1:-1;r.tx=side*(SPACE.hx-0.33);r.tz=MS.gz;r.maxS=0.8;r.style=sty('SMILE',WARM);});}
}
function startBlock(angry){MS.state='block';MS.st=0;MS.dir=walkDir();MS.gz=clamp(player.z+MS.dir*1.5,-SPACE.hz+0.4,SPACE.hz-0.4);MS.calm=0;MS.angry=angry?1.8:0;
  MS.blockers=[...ACTIVE].sort((a,b)=>Math.abs(a.z-MS.gz)+Math.abs(a.x)*0.3-(Math.abs(b.z-MS.gz)+Math.abs(b.x)*0.3)).slice(0,4);
  MS.blockers.forEach((r,k)=>{emo(r,angry?'ANGRY':'GRIM',angry?REDC:COOL,1.2);say(r,angry?'angry':'curious',k*0.12);});}

// ---------- V3 FOLLOW: each rover to its nearest visitor, ring 2.2 ft round them ----------
function followInit(){ACTIVE.forEach(r=>{r.x=LAT[r.i][0];r.z=LAT[r.i][1];r.tx=r.x;r.tz=r.z;r.vx=r.vz=0;r.yaw=Math.atan2(player.x-r.x,player.z-r.z);r.style=sty('NEUTRAL',WHITE);});MS.heartT=3;}
function updFollow(dt){
  const vs=visitors.filter(v=>inSpace(v,1));if(!vs.length)vs.push(player);
  const groups=new Map(vs.map(v=>[v,[]]));
  ACTIVE.forEach(r=>{let best=vs[0],bd=1e9;vs.forEach(v=>{const d=dist(r,v);if(d<bd){bd=d;best=v;}});groups.get(best).push(r);r.vis=best;});
  for(const [v,list] of groups){
    list.sort((a,b)=>dist(a,v)-dist(b,v));const inner=list.slice(0,8),outer=list.slice(8);
    ringAssign(inner,v.x,v.z,0.67+0.13,0);if(outer.length)ringAssign(outer,v.x,v.z,1.45,0);
    const fastV=v.speed>0.95,still=v.still>5;
    list.forEach(r=>{r.maxS=1.1;r.style=fastV?sty('SURPRISED',C_YEL,{fast:true}):still?sty('SMILE',WARM):sty('SMILE',WARM,{fast:true});
      r.tx=clamp(r.tx,-SPACE.hx+0.3,SPACE.hx-0.3);r.tz=clamp(r.tz,-SPACE.hz+0.3,SPACE.hz-0.3);});
  }
  MS.heartT-=dt;if(MS.heartT<=0){MS.heartT=rand(2.5,4.5);const r=ACTIVE[Math.floor(Math.random()*ACTIVE.length)];if(dist(r,r.vis||player)<1.6){emo(r,'HEART',C_LOVE,1.8);say(r,'happy',0,);}}
}

// ---------- V4 PARK: strolling pairs, talks, benches; the visitor's tile sets the mood ----------
const PARK_TALK=[['QUESTION','SMILE'],['CURIOUS','SURPRISED'],['SMILE','JOY'],['BORED','SLEEP'],['HEART','SMILE'],['SURPRISED','FEAR'],['EYE','CURIOUS'],['SAD','HEART'],['GRIM','DISGUST'],['JOY','HEART']];
const FACE_C={SMILE:WARM,JOY:WARM,HEART:C_LOVE,QUESTION:WHITE,CURIOUS:C_CUR,SURPRISED:C_YEL,BORED:[150,150,150],SLEEP:SLEEPC,FEAR:[190,170,255],EYE:WHITE,SAD:C_SAD,GRIM:COOL,DISGUST:C_DISG,NEUTRAL:WHITE,ANGRY:REDC};
const MOODTILE={YELLOW:'accept',VERMILION:'disgust',SAGE:'cheer',COBALT:'angry'};
function parkPoint(){for(let k=0;k<40;k++){const x=rand(-SPACE.hx+0.6,SPACE.hx-0.6),z=rand(-SPACE.hz+0.6,SPACE.hz-0.6);if(OBST.every(o=>Math.hypot(x-o.x,z-o.z)>o.r+0.55))return {x,z};}return {x:0,z:0};}
function parkInit(){
  MS.pairs=[];for(let i=0;i<ACTIVE.length;i+=2){const a=ACTIVE[i],b=ACTIVE[i+1];if(!b)break;const p=parkPoint();
    [a,b].forEach((r,k)=>{r.x=p.x+(k?0.32:-0.32);r.z=p.z;r.tx=r.x;r.tz=r.z;r.vx=r.vz=0;r.yaw=k?-Math.PI/2:Math.PI/2;r.style=sty('SMILE',WARM);});
    MS.pairs.push({a,b,state:'talk',t:rand(3,7),wp:parkPoint(),turn:0,talkT:rand(0.3,1.2),glance:0,seat:null});}
  MS.mood=null;
}
function updPark(dt){
  // the visitor's tile
  let onTile=null;for(const t of TILES){if(!MOODTILE[t.name])continue;const ins=Math.abs(player.x-t.x)<CELL/2&&Math.abs(player.z-t.z)<CELL/2;t.on=ins?t.on+dt:0;if(ins&&t.on>0.8)onTile=t;
    t.mat.emissiveIntensity=damp(t.mat.emissiveIntensity,MS.mood&&MS.mood.tile===t?0.55:ins?0.25:0,6,dt);}
  if(onTile&&(!MS.mood||MS.mood.tile!==onTile)){MS.mood={kind:MOODTILE[onTile.name],tile:onTile,t:0,left:0};moodEnter(MS.mood.kind);}
  if(MS.mood){MS.mood.t+=dt;if(!onTile){MS.mood.left+=dt;if(MS.mood.left>3.5){MS.mood=null;MS.pairs.forEach(P=>{P.state='stroll';P.wp=parkPoint();});}}else MS.mood.left=0;}
  if(MS.mood){moodTargets(dt);return;}
  // ordinary park life
  for(const P of MS.pairs){const {a,b}=P;P.t-=dt;
    if(P.state==='stroll'){const cx=(a.x+b.x)/2,cz=(a.z+b.z)/2,dx=P.wp.x-cx,dz=P.wp.z-cz,d=Math.hypot(dx,dz)||1;const ux=dx/d,uz=dz/d,step=Math.min(d,0.8);
      const lx=cx+ux*step,lz=cz+uz*step;a.tx=lx-uz*0.32;a.tz=lz+ux*0.32;b.tx=lx+uz*0.32;b.tz=lz-ux*0.32;a.maxS=b.maxS=0.32;a.vis={x:a.tx+ux,z:a.tz+uz};b.vis={x:b.tx+ux,z:b.tz+uz};
      a.style=sty('SMILE',WARM);b.style=sty('NEUTRAL',WHITE);
      if(d<0.45){const r=Math.random();if(r<0.45){P.state='talk';P.t=rand(6,10);P.talkT=0.4;}else if(r<0.7&&freeBench()){const bn=freeBench();P.seat=bn;bn.seats.forEach(s=>s.taken=P);P.state='rest';P.t=rand(8,13);}else{P.wp=parkPoint();}}}
    else if(P.state==='talk'){a.tx=a.x;a.tz=a.z;b.tx=b.x;b.tz=b.z;a.vis=b;b.vis=a;a.maxS=b.maxS=0.3;
      if(dist(a,b)>0.85){a.tx=(a.x+b.x)/2+(a.x-b.x)*0.25;a.tz=(a.z+b.z)/2+(a.z-b.z)*0.25;b.tx=(a.x+b.x)/2-(a.x-b.x)*0.25;b.tz=(a.z+b.z)/2-(a.z-b.z)*0.25;}
      P.talkT-=dt;if(P.talkT<=0){P.talkT=1.35;const pair=PARK_TALK[Math.floor(Math.random()*PARK_TALK.length)];const sp=P.turn%2?b:a,ls=P.turn%2?a:b;P.turn++;
        emo(sp,pair[0],FACE_C[pair[0]],1.2);P.reply={r:ls,f:pair[1],t:0.65};const v=VOL;VOL*=0.45;say(sp,'murmur');VOL=v;}
      if(P.reply){P.reply.t-=dt;if(P.reply.t<=0){emo(P.reply.r,P.reply.f,FACE_C[P.reply.f],1.1);P.reply=null;}}
      a.style=sty('NEUTRAL',WHITE);b.style=sty('NEUTRAL',WHITE);
      if(P.t<=0){P.state='stroll';P.wp=parkPoint();}}
    else if(P.state==='rest'){const s=P.seat.seats;a.tx=s[0].x;a.tz=s[0].z;b.tx=s[1].x;b.tz=s[1].z;a.maxS=b.maxS=0.3;
      const look={x:P.seat.x+P.seat.fx*3,z:P.seat.z+P.seat.fz*3};a.vis=look;b.vis=look;const sat=dist(a,{x:s[0].x,z:s[0].z})<0.25;
      a.style=sat?sty(P.t<4?'SMILE':'SLEEP',P.t<4?WARM:SLEEPC,{breath:P.t>=4}):sty('SMILE',WARM);b.style=sat?sty('BORED',[150,150,150]):sty('SMILE',WARM);
      if(P.t<=0){P.seat.seats.forEach(x=>x.taken=null);P.seat=null;P.state='stroll';P.wp=parkPoint();}}
    // a glance at the visitor walking past
    P.glance-=dt;const near=Math.min(dist(a,player),dist(b,player));if(near<2.2&&P.glance<=0&&P.state!=='rest'){P.glance=9;[a,b].forEach((r,k)=>{emo(r,'CURIOUS',C_CUR,1.8);r.vis=player;});say(a,'curious');}
    if(P.glance>7.2){a.vis=player;b.vis=player;}
  }
}
function freeBench(){return MS.benches.find(b=>b.seats.every(s=>!s.taken))||null;}
function moodEnter(k){
  if(k==='accept')ACTIVE.forEach((r,i)=>{emo(r,'HEART',C_LOVE,2.5);say(r,'happy',i*0.09);r.flash=1;});
  if(k==='disgust')ACTIVE.forEach((r,i)=>{emo(r,'DISGUST',C_DISG,1.8);if(i<5)say(r,'disgust',i*0.12);});
  if(k==='cheer')ACTIVE.forEach((r,i)=>{say(r,'excited',i*0.07);r.flash=1;});
  if(k==='angry')ACTIVE.forEach((r,i)=>{emo(r,'ANGRY',REDC,2);if(i<4)say(r,'angry',i*0.1);});
  MS.benches.forEach(b=>b.seats.forEach(s=>s.taken=null));MS.pairs.forEach(P=>P.seat=null);MS.awayDone=false;MS.hmph=1.5;
}
function moodTargets(dt){
  const M=MS.mood;
  if(M.kind==='accept'){ringAssign(ACTIVE,player.x,player.z,1.3,0.06);ACTIVE.forEach(r=>{r.vis=player;r.maxS=0.7;r.style=sty('HEART',C_LOVE);});}
  if(M.kind==='cheer'){ringAssign(ACTIVE,player.x,player.z,1.25,0.55);ACTIVE.forEach(r=>{r.vis=player;r.maxS=0.95;r.style=sty('JOY',WARM,{sparkle:true,fast:true});});}
  if(M.kind==='angry'){ringAssign(ACTIVE,player.x,player.z,1.35,0);const w=Math.sin(MS.t*18)*0.05;ACTIVE.forEach((r,i)=>{r.vis=player;r.maxS=0.8;r.tx+=w*(i%2?1:-1);r.style=sty('ANGRY',REDC,{mode:'angry',fast:true});});
    MS.hmph-=dt;if(MS.hmph<=0){MS.hmph=rand(1.6,2.6);say(ACTIVE[Math.floor(Math.random()*ACTIVE.length)],'angry');}}
  if(M.kind==='disgust'){
    if(M.t<1.6){ACTIVE.forEach(r=>{r.tx=r.x;r.tz=r.z;r.vis=player;r.style=sty('DISGUST',C_DISG);});}
    else{if(!MS.awayDone){MS.awayDone=true;ACTIVE.forEach(r=>{const dx=r.x-player.x,dz=r.z-player.z,d=Math.hypot(dx,dz)||1;r.awayX=clamp(r.x+dx/d*1.3,-SPACE.hx+0.4,SPACE.hx-0.4);r.awayZ=clamp(r.z+dz/d*1.3,-SPACE.hz+0.4,SPACE.hz-0.4);});ACTIVE.slice(0,3).forEach((r,k)=>say(r,'disgust',k*0.15));}
      ACTIVE.forEach(r=>{r.tx=r.awayX;r.tz=r.awayZ;r.maxS=0.45;const dx=r.x-player.x,dz=r.z-player.z;r.vis={x:r.x+dx*3,z:r.z+dz*3};r.style=sty('GRIM',COOL);});}}
}

// ---------- V5 GUARD: home spots, scanning; smile at entry, angry block when fast ----------
const GUARD_HOMES=[[-0.7,-2.0],[0.7,-0.7],[-0.7,0.7],[0.7,2.0]];
function guardInit(){ACTIVE.forEach((r,i)=>{const h=GUARD_HOMES[i];r.home={x:h[0],z:h[1]};r.x=h[0];r.z=h[1];r.tx=r.x;r.tz=r.z;r.vx=r.vz=0;r.yaw=h[0]<0?Math.PI/2:-Math.PI/2;r.scanP={x:0,z:0};r.style=sty('EYE',WHITE);});MS.state='idle';MS.st=0;}
function updGuard(dt){
  const inside=inSpace(player,0.05),cls=player.cls;MS.st+=dt;const go=s=>{MS.state=s;MS.st=0;};
  if(MS.state==='idle'&&inside){go('watch');ACTIVE.forEach((r,k)=>{emo(r,'SMILE',WARM,2);say(r,'hello',k*0.15);r.flash=1;});}
  if(MS.state!=='idle'&&!inside){go('idle');ACTIVE.forEach(r=>emo(r,'SMILE',WARM,1.2));}
  if(MS.state==='watch'&&cls==='fast'){go('block');MS.dir=walkDir();MS.calm=0;ACTIVE.forEach((r,k)=>say(r,'angry',k*0.1));}
  if(MS.state==='block'){MS.gz=clamp(player.z+MS.dir*1.3,-SPACE.hz+0.35,SPACE.hz-0.35);MS.calm=(cls==='slow'||cls==='still')?MS.calm+dt:0;if(cls==='fast')MS.calm=0;
    if(MS.st>2.5&&MS.calm>1.5){go('return');ACTIVE.forEach((r,k)=>{emo(r,'SMILE',WARM,2);say(r,'happy',k*0.12);});}}
  if(MS.state==='return'&&MS.st>2.5)go('watch');
  ACTIVE.forEach((r,i)=>{
    if(MS.state==='idle'){r.tx=r.home.x;r.tz=r.home.z;r.maxS=0.5;const base=r.home.x<0?Math.PI/2:-Math.PI/2;const a=base+Math.sin(MS.t*0.7+i*1.3)*1.25;r.scanP.x=r.x+Math.sin(a)*2;r.scanP.z=r.z+Math.cos(a)*2;r.vis=r.scanP;r.style=sty('EYE',WHITE);}
    else if(MS.state==='block'){const W=2*SPACE.hx-0.66;r.tx=-W/2+W*i/3;r.tz=MS.gz;r.maxS=1.05;r.vis=player;r.style=sty('ANGRY',REDC,{fast:true,mode:'angry'});}
    else{r.tx=r.home.x;r.tz=r.home.z;r.maxS=0.7;r.vis=player;r.style=sty('SMILE',WARM);}
  });
}

// ---------- AR alignment for every version ----------
let ALIGN=null;
function refForward(){camera.getWorldDirection(tmpV2);tmpV2.applyQuaternion(dolly.quaternion.clone().invert());tmpV2.y=0;return tmpV2.normalize();}
function chooseTheta(rect){const f=refForward();let best=rect.theta,bv=-9;
  for(let k=0;k<4;k++){const th=rect.theta+k*Math.PI/2;const w=k%2?rect.d:rect.w,d=k%2?rect.w:rect.d;if(SPACE.kind==='corridor'&&d+0.01<w)continue;const vz=f.x*Math.sin(th)+f.z*Math.cos(th);if(-vz>bv){bv=-vz;best=th;}}return best;}
function applyAlign(){
  if(!ALIGN)return;
  if(ALIGN.kind==='scan'){const r=ALIGN.rect;alignTo({cx:r.cx,cz:r.cz,theta:chooseTheta(r)});}
  else{const th=Math.atan2(ALIGN.fx,ALIGN.fz)+Math.PI;const S0=modeStart();alignTo({cx:ALIGN.hx-S0.z*Math.sin(th),cz:ALIGN.hz-S0.z*Math.cos(th),theta:th});}
}
function poseAlignHere(){dolly.position.set(0,0,0);dolly.quaternion.identity();dolly.updateMatrixWorld(true);camera.getWorldPosition(tmpV);camera.getWorldDirection(tmpV2);tmpV2.y=0;tmpV2.normalize();ALIGN={kind:'pose',hx:tmpV.x,hz:tmpV.z,fx:tmpV2.x,fz:tmpV2.z};applyAlign();}
let contentOn=true;function contentShown(){return contentOn;}
function showContent(on){contentOn=on;ACTIVE.forEach(r=>r.group.visible=on);const parkSet=['YELLOW','VERMILION','SAGE','COBALT'];TILES.forEach(t=>t.mesh.visible=on&&SPACE.kind==='room'&&(MODE!=='V4'||parkSet.includes(t.name)));park.visible=on&&MODE==='V4';tape.visible=on;}
const btnPrev={};
function pollButtons(){const s=renderer.xr.getSession();if(!s)return;for(const src of s.inputSources){const gp=src.gamepad;if(!gp)continue;[4,5].forEach(b=>{const p=!!(gp.buttons[b]&&gp.buttons[b].pressed);const k=src.handedness+b;if(p&&!btnPrev[k])switchMode(b===4?1:-1);btnPrev[k]=p;});}}

// ================= render quality =================
const PR=Math.min(devicePixelRatio,1.75);
const rt=new THREE.WebGLRenderTarget(innerWidth*PR,innerHeight*PR,{type:THREE.HalfFloatType,samples:4});
const composer=new EffectComposer(renderer,rt);composer.setPixelRatio(PR);composer.setSize(innerWidth,innerHeight);
const renderPass=new RenderPass(scene,camera);composer.addPass(renderPass);
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.32,0.35,0.9);composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},time:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D tDiffuse;uniform float time;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+time)*43758.5453);}void main(){vec4 c=texture2D(tDiffuse,vUv);vec2 d=vUv-.5;float v=smoothstep(.9,.2,length(d*vec2(1.15,1.)));c.rgb*=mix(.55,1.,v);c.rgb+=(h(vUv*1000.)-.5)*.03;gl_FragColor=c;}'});
composer.addPass(grade);
function setQuality(xr){reflector.visible=!xr;floor.material.transparent=!xr;floor.material.opacity=xr?1:0.8;floor.material.needsUpdate=true;accentSpots.forEach(s=>s.castShadow=!xr);rovers.forEach(r=>r.haloMat.opacity=xr?0.14:0.035);}
setQuality(false);
addEventListener('resize',()=>{composer.setSize(innerWidth,innerHeight);});
let bob=0;

// ================= loop =================
const clock=new THREE.Clock();let screenT=0,hudT=0,assignT=0,introT=0;
let loopErrs=0;
function frame(time,xrFrame){try{frameInner(time,xrFrame);}catch(e){if(loopErrs++<5)console.error(e);try{renderer.render(scene,camera);}catch(e2){}}}
function frameInner(time,xrFrame){
  const dt=Math.min(0.05,clock.getDelta())||0.016;
  if(arMode&&xrFrame)arUpdate(xrFrame,dt);
  if(S.phase==='intro'&&!renderer.xr.isPresenting){introT+=dt;yaw=Math.sin(introT*0.12)*0.25;pitch=-0.08;}
  movePlayer(dt);trackPlayer(dt);
  ghosts.forEach(g=>updGhost(g,dt));
  if(MODE==='V1'){updGame(dt);assignT-=dt;if(assignT<=0){assignT=1.5;assignWorkers();}planTargets();}
  else modeUpdate(dt);
  ACTIVE.forEach(r=>r.step(dt,visitors));resolve();
  const t=performance.now()/1000;
  ACTIVE.forEach(r=>{r.pose(dt,t);r.look(dt,t);});
  camLeds.forEach((l,i)=>l.visible=Math.sin(t*3+i)>-0.3);
  updTrail(dt);
  if(renderer.xr.isPresenting)ctrls.forEach(c=>{c.getWorldPosition(tmpV);for(const r of rovers){if(r.pokeCool>0)continue;r.headPos(tmpV2);tmpV2.y+=0.06;if(tmpV.distanceTo(tmpV2)<0.2||(Math.hypot(tmpV.x-r.x,tmpV.z-r.z)<0.16&&tmpV.y<0.25))poke(r);}});
  if(overview){dirYaw+=dt*0.015;dirCam.position.set(Math.sin(dirYaw)*dirDist,dirDist*0.68,Math.cos(dirYaw)*dirDist);dirCam.lookAt(0,0.2,0);avatar.position.set(player.x,0,player.z);avatar.rotation.y=yaw;}
  updParticles(dt);updAudio();

  hudT-=dt;if(hudT<=0&&S.phase!=='intro'){hudT=0.2;const bar='█'.repeat(Math.round(S.obed*12))+'·'.repeat(12-Math.round(S.obed*12));
    $('#tl').textContent=`CONDITIONALS — ${PNAME[S.phase]}\ntime ${fmt(S.t)}   speed ${player.speed.toFixed(2)} m/s  ${player.cls.toUpperCase()}\nobedience ${bar} ${Math.round(S.obed*100)}%\nsmiles ${S.rewards}  ·  frowns ${S.punish}  ·  tiles ${S.visited.size}/8`;}
  if(renderer.xr.isPresenting){vrHudT-=dt;if(vrHudT<=0||vrHudDirty){vrHudT=0.3;vrHudDirty=false;drawVRHud();}}
  if(renderer.xr.isPresenting)renderer.render(scene,camera);
  else{if(!overview&&S.phase!=='intro'){bob+=dt*player.speed*7;camera.position.y=1.62+Math.sin(bob)*0.012*Math.min(1,player.speed);}renderPass.camera=overview?dirCam:camera;grade.uniforms.time.value=t%100;composer.render(dt);}
}
renderer.setAnimationLoop(frame);
window.CA={get MODE(){return MODE;},MS,SPACE,active:()=>ACTIVE,initMode,player,TILES,dolly,setYaw:(y,p)=>{yaw=y;pitch=p;}};
window.CONDITIONALS={dolly,camera,rovers,S,poke,toggleView,setYaw:(y,p)=>{yaw=y;pitch=p;}};
</script>
