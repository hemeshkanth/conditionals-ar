/* VOICE: quiet, clinical; the rovers are the only interface
   IDEA: a live mixed-reality layer on a real campus corridor
   PICTURE: the real corridor through passthrough, eleven black rovers on its floor
   COLOUR and TYPE: black, white, LED colour only; IBM Plex Mono

:root{color-scheme:dark;--ink:#f2f2f2}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:15px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden}

.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:12px 18px;min-height:44px;cursor:pointer;border-radius:0}
button.primary{background:var(--ink);color:#000}
button:hover{background:#fff;color:#000}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;background:transparent;color:var(--ink)}
#map{position:fixed;left:14px;bottom:14px;width:240px;height:240px;border:1px solid rgba(255,255,255,.25);display:none;z-index:4;image-rendering:pixelated}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(255,255,255,.4);display:none;z-index:4}
</style>

function textToCols(str,color=[240,240,240]){

// ================= materials & shared geometry =================

const R_APO=5*0.0254, R_OCT=R_APO/Math.cos(Math.PI/8), SHELL_H=0.068, R_TOP=R_OCT-0.058, WHEEL_R=0.029, WX=0.112, WZ=0.072, thS=Math.PI/8;
function makeWheel(hand){
  const hub=new THREE.CylinderGeometry(0.017,0.017,0.02,20);hub.rotateZ(Math.PI/2);
  const p1=new THREE.CylinderGeometry(0.026,0.026,0.002,20);p1.rotateZ(Math.PI/2);p1.translate(0.0115,0,0);
  const p2=p1.clone();p2.translate(-0.023,0,0);
  const rollers=[],n=9,R=0.0225,up=new THREE.Vector3(0,1,0);
  for(let k=0;k<n;k++){const a=k/n*Math.PI*2;const g=new THREE.CapsuleGeometry(0.0062,0.013,2,8);const t=new THREE.Vector3(0,-Math.sin(a),Math.cos(a));const ax=new THREE.Vector3(hand,0,0).add(t).normalize();g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(up,ax));g.translate(0,Math.cos(a)*R,Math.sin(a)*R);rollers.push(g);}

const GEO={};
GEO.base=new THREE.CylinderGeometry(R_OCT,R_OCT,0.005,8,1,false,thS);
{const a=[],b=[],gap=0.035;for(let i=0;i<8;i++){const g=new THREE.CylinderGeometry(R_TOP,R_OCT,SHELL_H,1,1,true,thS+i*Math.PI/4+gap/2,Math.PI/4-gap);(i%2?b:a).push(g);}GEO.panA=mergeGeometries(a);GEO.panB=mergeGeometries(b);}
GEO.core=new THREE.CylinderGeometry(R_TOP-0.006,R_OCT-0.009,SHELL_H-0.004,8,1,false,thS);
GEO.top=new THREE.CylinderGeometry(R_TOP+0.003,R_TOP+0.003,0.005,8,1,false,thS);
GEO.wA=makeWheel(1);GEO.wB=makeWheel(-1);
GEO.motor=new THREE.CylinderGeometry(0.0115,0.0115,0.042,14);GEO.motor.rotateZ(Math.PI/2);
GEO.collar=new THREE.CylinderGeometry(0.014,0.02,0.022,20);

function markerTex(id){return canvasTex(64,64,(g)=>{g.fillStyle='#fff';g.fillRect(0,0,64,64);g.fillStyle='#000';g.fillRect(6,6,52,52);let s=id*7919+17;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};g.fillStyle='#fff';for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(rnd()>.5)g.fillRect(14+x*9,14+y*9,9,9);});}

// ================= rover =================
const MOODS={

const LAT=[[-1.25,0.75],[1.25,0.75],[-1.85,-1.75],[-0.62,-1.75],[0.62,-1.75],[1.85,-1.75],[-2.4,-0.5],[-1.2,-0.5],[0,-0.5],[1.2,-0.5],[2.4,-0.5]];
class Rover{
  constructor(i,kind,rows,cols,height){
    Object.assign(this,{i,id:'R'+String(i+1).padStart(2,'0'),kind,rows,cols,height,x:LAT[i][0],z:LAT[i][1],vx:0,vz:0,yaw:0,yawRate:0,headYaw:0,tx:0,tz:0,sx:0,sz:0,svx:0,svz:0,pvx:0,pvz:0,flash:0,vis:null,key:'',speech:null,override:null,attach:0,pokeCool:0,pick:[],loopText:null,qOn:0,vp:(kind==='herald'?0.8:rand(0.9,1.25)),queue:[],blinkT:rand(1,5),seed:Math.random()*100,style:MOODS.sleep,lc:WHITE});

    add(GEO.top,MAT.acrylic,0.135);

    const mk=new THREE.Mesh(GEO.marker,new THREE.MeshStandardMaterial({map:markerTex(this.i+3),roughness:.75}));mk.position.set(0,0.1381,0.03);g.add(mk);

    this.wheels=[];
    for(const sx of [1,-1])for(const sz of [1,-1]){const hand=sx*sz;const geo=hand>0?GEO.wA:GEO.wB;const w=new THREE.Group();w.position.set(sx*WX,WHEEL_R,sz*WZ);const h=new THREE.Mesh(geo.hub,MAT.aluRaw);const rl=new THREE.Mesh(geo.rol,MAT.rubber);h.castShadow=rl.castShadow=true;w.add(h,rl);g.add(w);this.wheels.push({w,sx,hand});const mo=new THREE.Mesh(GEO.motor,MAT.aluRaw);mo.position.set(sx*0.083,WHEEL_R,sz*WZ);g.add(mo);}

    const P=0.12,headH=this.rows*P+0.016,headW=this.cols*P+0.016,D=0.03;
    const rodLen=this.height-0.1375-0.022-0.03-headH;

}

const bar=$('#bar');
(async()=>{if(!navigator.xr){bar.disabled=true;bar.textContent='AR needs a Quest browser';return;}try{const ok=await navigator.xr.isSessionSupported('immersive-ar');if(!ok){bar.disabled=true;bar.textContent='AR needs a Quest browser';}}catch(e){bar.disabled=true;bar.textContent='AR is blocked in this frame';}})();
bar.onclick=()=>startAR().catch(()=>{bar.textContent='Could not start AR here';bar.disabled=true;});
$('#bsim').onclick=()=>{audioInit();simOn=true;$('#intro').style.display='none';$('#cross').style.display='block';dolly.position.set(0,0,1.2);yaw=0;resetMap();autoT=3;canvas.focus();};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ================= loop =================
const clock=new THREE.Clock();let mapT=0,introT=0;dolly.position.set(0,0,1.2);
renderer.setAnimationLoop((time,frame)=>{
  const dt=Math.min(0.05,clock.getDelta())||0.016,t=performance.now()/1000;
  if(arSession){if(frame)arFrame(frame);}
  else{if(!simOn){introT+=dt;yaw=Math.sin(introT*0.15)*0.3;camera.rotation.set(pitch,yaw,0,'YXZ');}else moveSim(dt);simHits();}
  trackPlayer(dt);clearUnderWalker();
  if(autoT>0){autoT-=dt;if(autoT<=0&&!SW.placed&&(simOn||arSession))placeSwarm(player.x+player.fx*5.5,player.z+player.fz*5.5);}
  updSwarm(dt);
  if(SW.placed){rovers.forEach(r=>r.step(dt,visitors));resolve();rovers.forEach(r=>{r.pose(dt,t);r.look(dt,t);});}
  sun.position.set(player.x+2,6,player.z+1);sun.target.position.set(player.x,0,player.z);sun.target.updateMatrixWorld();
  updAudio();
  mapT-=dt;if(mapT<=0){mapT=0.25;drawMap();updDebug();}
  renderer.render(scene,camera);
});
window.CONDITIONALS_AR={dolly,camera,rovers,SW,SG,G,player,setYaw:(y,p)=>{yaw=y;pitch=p;},placeSwarm};
</script>
</body>
</html>
