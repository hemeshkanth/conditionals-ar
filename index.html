<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conditionals — Campus AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, clinical; the rovers are the only interface
   IDEA: a live mixed-reality layer on a real campus corridor
   PICTURE: the real corridor through passthrough, eleven black rovers on its floor
   COLOUR and TYPE: black, white, LED colour only; IBM Plex Mono
   LAYOUT: full-screen canvas; intro card; no text once inside */
:root{color-scheme:dark;--ink:#f2f2f2}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:15px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#intro{position:fixed;inset:0;display:grid;align-items:end;padding:max(4vw,20px);background:linear-gradient(90deg,rgba(0,0,0,.93),rgba(0,0,0,.55) 50%,rgba(0,0,0,0) 80%);z-index:6}
h1{font-size:clamp(40px,7vw,84px);line-height:1;margin:0 0 20px;font-weight:600;letter-spacing:-.03em}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:12px 18px;min-height:44px;cursor:pointer;border-radius:0}
button.primary{background:var(--ink);color:#000}
button:hover{background:#fff;color:#000}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;background:transparent;color:var(--ink)}
#map{position:fixed;left:14px;bottom:14px;width:240px;height:240px;border:1px solid rgba(255,255,255,.25);display:none;z-index:4;image-rendering:pixelated}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(255,255,255,.4);display:none;z-index:4}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>

function textToCols(str,color=[240,240,240]){

const LEDPX=12;

// ================= materials & shared geometry =================
const MAT={

const R_APO=5*0.0254, R_OCT=R_APO/Math.cos(Math.PI/8), SHELL_H=0.068, R_TOP=R_OCT-0.058, WHEEL_R=0.029, WX=0.112, WZ=0.072, thS=Math.PI/8;
function makeWheel(hand){
  const hub=new THREE.CylinderGeometry(0.017,0.017,0.02,20);hub.rotateZ(Math.PI/2);
  const p1=new THREE.CylinderGeometry(0.026,0.026,0.002,20);p1.rotateZ(Math.PI/2);p1.translate(0.0115,0,0);
  const p2=p1.clone();p2.translate(-0.023,0,0);
  const rollers=[],n=9,R=0.0225,up=new THREE.Vector3(0,1,0);
  for(let k=0;k<n;k++){const a=k/n*Math.PI*2;const g=new THREE.CapsuleGeometry(0.0062,0.013,2,8);const t=new THREE.Vector3(0,-Math.sin(a),Math.cos(a));const ax=new THREE.Vector3(hand,0,0).add(t).normalize();g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(up,ax));g.translate(0,Math.cos(a)*R,Math.sin(a)*R);rollers.push(g);}

const GEO={};
GEO.base=new THREE.CylinderGeometry(R_OCT,R_OCT,0.005,8,1,false,thS);
{const a=[],b=[],gap=0.035;for(let i=0;i<8;i++){const g=new THREE.CylinderGeometry(R_TOP,R_OCT,SHELL_H,1,1,true,thS+i*Math.PI/4+gap/2,Math.PI/4-gap);(i%2?b:a).push(g);}GEO.panA=mergeGeometries(a);GEO.panB=mergeGeometries(b);}
GEO.core=new THREE.CylinderGeometry(R_TOP-0.006,R_OCT-0.009,SHELL_H-0.004,8,1,false,thS);
GEO.top=new THREE.CylinderGeometry(R_TOP+0.003,R_TOP+0.003,0.005,8,1,false,thS);
GEO.wA=makeWheel(1);GEO.wB=makeWheel(-1);
GEO.motor=new THREE.CylinderGeometry(0.0115,0.0115,0.042,14);GEO.motor.rotateZ(Math.PI/2);
GEO.collar=new THREE.CylinderGeometry(0.014,0.02,0.022,20);
GEO.bracket=new THREE.BoxGeometry(0.044,0.03,0.026);

function markerTex(id){return canvasTex(64,64,(g)=>{g.fillStyle='#fff';g.fillRect(0,0,64,64);g.fillStyle='#000';g.fillRect(6,6,52,52);let s=id*7919+17;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};g.fillStyle='#fff';for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(rnd()>.5)g.fillRect(14+x*9,14+y*9,9,9);});}

// ================= rover =================
const MOODS={

const LAT=[[-1.25,0.75],[1.25,0.75],[-1.85,-1.75],[-0.62,-1.75],[0.62,-1.75],[1.85,-1.75],[-2.4,-0.5],[-1.2,-0.5],[0,-0.5],[1.2,-0.5],[2.4,-0.5]];
class Rover{
  constructor(i,kind,rows,cols,height){
    Object.assign(this,{i,id:'R'+String(i+1).padStart(2,'0'),kind,rows,cols,height,x:LAT[i][0],z:LAT[i][1],vx:0,vz:0,yaw:0,yawRate:0,headYaw:0,tx:0,tz:0,sx:0,sz:0,svx:0,svz:0,pvx:0,pvz:0,flash:0,vis:null,key:'',speech:null,override:null,attach:0,pokeCool:0,pick:[],loopText:null,qOn:0,vp:(kind==='herald'?0.8:rand(0.9,1.25)),queue:[],blinkT:rand(1,5),seed:Math.random()*100,style:MOODS.sleep,lc:WHITE});

    add(GEO.core,this.coreMat,0.0985,g,false);
    add(GEO.top,MAT.acrylic,0.135);
    for(const [sx,sz] of [[.05,.04],[-.05,.04],[.05,-.045],[-.05,-.045]]){const sc=new THREE.Mesh(GEO.screw,MAT.aluRaw);sc.position.set(sx,0.1381,sz);g.add(sc);}

    const mk=new THREE.Mesh(GEO.marker,new THREE.MeshStandardMaterial({map:markerTex(this.i+3),roughness:.75}));mk.position.set(0,0.1381,0.03);g.add(mk);

    this.wheels=[];
    for(const sx of [1,-1])for(const sz of [1,-1]){const hand=sx*sz;const geo=hand>0?GEO.wA:GEO.wB;const w=new THREE.Group();w.position.set(sx*WX,WHEEL_R,sz*WZ);const h=new THREE.Mesh(geo.hub,MAT.aluRaw);const rl=new THREE.Mesh(geo.rol,MAT.rubber);h.castShadow=rl.castShadow=true;w.add(h,rl);g.add(w);this.wheels.push({w,sx,hand});const mo=new THREE.Mesh(GEO.motor,MAT.aluRaw);mo.position.set(sx*0.083,WHEEL_R,sz*WZ);g.add(mo);}

    const P=0.12,headH=this.rows*P+0.016,headW=this.cols*P+0.016,D=0.03;
    const rodLen=this.height-0.1375-0.022-0.03-headH;

// From the live map, every 0.4 s: what kind of place is the walker in?
function placeAt(x,z,hx,hz){
  const runs=[];for(let k=0;k<16;k++){const a=k*Math.PI/8;runs.push(run(x,z,Math.sin(a),Math.cos(a),8));}
  const long=runs.map(r=>r>=3.2);const groups=[];let cur=null;
  for(let k=0;k<16;k++){if(long[k]){if(!cur){cur={ks:[]};groups.push(cur);}cur.ks.push(k);}else cur=null;}
  if(groups.length>1&&long[0]&&long[15]){const g0=groups.shift();groups[groups.length-1].ks.push(...g0.ks);}
  const branches=groups.filter(g=>g.ks.length<9).map(g=>{let sx=0,sz=0;g.ks.forEach(k=>{const a=k*Math.PI/8;sx+=Math.sin(a);sz+=Math.cos(a);});const m=Math.hypot(sx,sz)||1;return {dx:sx/m,dz:sz/m,len:Math.max(...g.ks.map(k=>runs[k]))};});
  const c=corridorAt(x,z);const width=c.left+c.right;const fwd=run(x,z,hx,hz,8);
  let type;
  if(branches.length>=3)type='junction';
  else if(width>4.6||groups.some(g=>g.ks.length>=9))type='open';
  else if(width<1.5)type='narrow';
  else if(fwd<2.2&&branches.length<=1)type='deadend';
  else type='corridor';
  return {type,branches,width,axis:c};
}
function snapFree(x,z){
  const ok=(x,z)=>{const id=gi(x,z);if(id<0||G.lo[id]>-0.2)return false;for(const [ox,oz] of NB)if(isOcc(gi(x+ox,z+oz)))return false;return true;};
  if(ok(x,z))return {x,z};for(let r=0.15;r<=1.6;r+=0.15)for(let a=0;a<6.28;a+=0.45){const px=x+Math.cos(a)*r,pz=z+Math.sin(a)*r;if(ok(px,pz))return {x:px,z:pz};}return null;}

// campus position follows every real step and drifts get corrected by each new fix.
// EDIT ZONES: right-click a spot in Google Maps, copy "lat, lon", set a radius (m) and a mood.
// moods: quiet · strict · playful · home · forbidden · finale
const ZONES=[
  // {name:'library',  lat:23.00000, lon:72.00000, r:25, mood:'quiet'},
  // {name:'canteen',  lat:23.00000, lon:72.00000, r:30, mood:'playful'},
  // {name:'admin',    lat:23.00000, lon:72.00000, r:25, mood:'strict'},
  // {name:'studio',   lat:23.00000, lon:72.00000, r:20, mood:'home'},
  // {name:'director', lat:23.00000, lon:72.00000, r:15, mood:'forbidden'},
  // {name:'gate',     lat:23.00000, lon:72.00000, r:20, mood:'finale'},
];
// zones in metres from the start point, used by the laptop simulator (and indoors without location)
const SIM_ZONES=[{name:'plaza',x:13,z:-28,r:6,mood:'playful'},{name:'quiet wing',x:-9,z:-21.3,r:3.5,mood:'quiet'},{name:'room',x:-22,z:-21,r:3.5,mood:'strict'}];
const R_E=6371000;
const LOC={started:false,ok:false,acc:999,lat0:null,lon0:null,samples:[],theta:null,T:null,est:null,zone:null,zoneT:0,trail:[]};
function llToM(lat,lon){return {e:(lon-LOC.lon0)*Math.PI/180*R_E*Math.cos(LOC.lat0*Math.PI/180),n:(lat-LOC.lat0)*Math.PI/180*R_E};}
function mToLL(e,n){return {lat:LOC.lat0+n/R_E*180/Math.PI,lon:LOC.lon0+e/(R_E*Math.cos(LOC.lat0*Math.PI/180))*180/Math.PI};}
function geoStart(){if(LOC.started||!('geolocation' in navigator))return;LOC.started=true;try{navigator.geolocation.watchPosition(onGeo,()=>{},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});}catch(e){}}
function onGeo(p){const {latitude:lat,longitude:lon,accuracy:acc}=p.coords;if(!isFinite(lat)||acc>150)return;
  if(LOC.lat0===null){LOC.lat0=lat;LOC.lon0=lon;}LOC.ok=true;LOC.acc=acc;const m=llToM(lat,lon);
  LOC.samples.push({e:m.e,n:m.n,ux:player.x,uy:-player.z,w:1/Math.max(9,acc*acc)});if(LOC.samples.length>240)LOC.samples.shift();
  fitMap();}
// weighted 2-D Procrustes: (e,n) = T + R(θ)·(x,−z)
function fitMap(){const S=LOC.samples;if(S.length<5)return;let W=0,ux=0,uy=0,e=0,n=0;S.forEach(s=>{W+=s.w;ux+=s.w*s.ux;uy+=s.w*s.uy;e+=s.w*s.e;n+=s.w*s.n;});ux/=W;uy/=W;e/=W;n/=W;
  let a=0,b=0,spread=0;S.forEach(s=>{const dx=s.ux-ux,dy=s.uy-uy,de=s.e-e,dn=s.n-n;a+=s.w*(dx*de+dy*dn);b+=s.w*(dx*dn-dy*de);spread+=s.w*(dx*dx+dy*dy);});
  if(Math.sqrt(spread/W)<7)return;   // need ~20–25 m of walking before the heading is trustworthy
  const th=Math.atan2(b,a),c=Math.cos(th),s=Math.sin(th);LOC.theta=th;LOC.T={e:e-(c*ux-s*uy),n:n-(s*ux+c*uy)};}
function geoEstimate(){
  if(LOC.lat0===null)return null;
  if(LOC.theta!==null){const c=Math.cos(LOC.theta),s=Math.sin(LOC.theta),ux=player.x,uy=-player.z;return {e:LOC.T.e+c*ux-s*uy,n:LOC.T.n+s*ux+c*uy,acc:Math.max(4,LOC.acc*0.5)};}

function currentZone(){
  if(simOn&&!arSession){for(const z of SIM_ZONES)if(Math.hypot(player.x-z.x,player.z-z.z)<z.r)return z;return null;}
  const p=geoEstimate();if(!p||!ZONES.length)return null;let best=null,bd=1e9;
  for(const z of ZONES){const m=llToM(z.lat,z.lon);const d=Math.hypot(p.e-m.e,p.n-m.n);if(d<z.r+Math.min(p.acc,20)&&d<bd){bd=d;best=z;}}return best;}
let VOL=1;
function zoneMod(){const m=LOC.zone?LOC.zone.mood:null;const night=(()=>{const h=new Date().getHours();return h>=19||h<6;})();
  const o={trust:0,vol:night?0.75:1,speed:night?0.85:1,strictMid:false,forgiveFast:false,block:false,roam:1};

  if(m==='strict'){o.trust=-0.3;o.strictMid=true;}

  if(m==='home'){o.trust=0.25;o.speed*=0.8;}

function updGeo(dt){
  LOC.zoneT-=dt;if(LOC.zoneT>0||!ST.on)return;LOC.zoneT=1;
  const est=geoEstimate();if(est){const ll=mToLL(est.e,est.n);const L=LOC.trail[LOC.trail.length-1];if(!L||Math.hypot(L.e-est.e,L.n-est.n)>2)LOC.trail.push({e:est.e,n:est.n,lat:ll.lat,lon:ll.lon,t:Date.now()});}

  if(z.mood==='quiet')pr.forEach((r,k)=>emote(r,'sleep',2.5,k<2));

}

function setAct(n){
  ST.act=n;ST.actT=0;
  if(n===2){ST.rule='slow';present().forEach((r,k)=>emote(r,'eye',1.6,k<3));}
  if(n===3){ST.rule='slow';}
  if(n===4){ST.rule='fast';ST.fastAcc=0;ST.adaptAt=null;present().forEach(r=>emote(r,'bored',1.5,false));}
  if(n===5){ST.gb={t:0,fa:Math.atan2(ST.hx,ST.hz),cx:player.x,cz:player.z,stage:0};}
}
function baseEmo(r){
  const a=ST.act,cls=player.cls;
  if(a===5)return r.fe||'eye';
  if(a===0)return 'curious';
  if(player.still>12)return a>=2?'sleep':'bored';
  if(player.still>6)return a>=2?personaEmo(r,'angry'):'bored';
  if(ST.place==='deadend')return 'question';
  if(ST.junc&&ST.junc.open)return 'question';
  if(a===1)return cls==='slow'?'happy':'curious';

}
function finalEmo(r){const a=r.aff+ST.trust*0.6;if(a>0.45)return 'love';if(a>0.12)return 'happy';if(a>-0.15)return ST.defy>ST.obey?'disgust':'neutral';if(a>-0.45)return personaEmo(r,'sad');return r.persona==='grumpy'?'disgust':'angry';}

  if(!mx&&!mz)return;const sp=keys.ShiftLeft||keys.ShiftRight?1.9:(keys.KeyC||keys.Space)?0.4:1.15;camera.getWorldDirection(tmpV2);tmpV2.y=0;tmpV2.normalize();const fx=tmpV2.x,fz=tmpV2.z,rx=-fz,rz=fx,m=Math.hypot(mx,mz);
  const nx=dolly.position.x+(fx*-mz+rx*mx)/m*sp*dt,nz=dolly.position.z+(fz*-mz+rz*mx)/m*sp*dt;
  if(simFree(nx,nz)){dolly.position.x=nx;dolly.position.z=nz;}else if(simFree(nx,dolly.position.z))dolly.position.x=nx;else if(simFree(dolly.position.x,nz))dolly.position.z=nz;}

// ================= start =================
const bar=$('#bar');
(async()=>{if(!navigator.xr){bar.disabled=true;bar.textContent='AR needs a Quest browser';return;}try{const ok=await navigator.xr.isSessionSupported('immersive-ar');if(!ok){bar.disabled=true;bar.textContent='AR needs a Quest browser';}}catch(e){bar.disabled=true;bar.textContent='AR is blocked in this frame';}})();
bar.onclick=()=>startAR().catch(()=>{bar.textContent='Could not start AR here';bar.disabled=true;});
$('#bsim').onclick=()=>{audioInit();simOn=true;$('#intro').style.display='none';$('#cross').style.display='block';dolly.position.set(0,0,1.2);yaw=0;resetMap();autoT=3;canvas.focus();};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ================= loop =================
const clock=new THREE.Clock();let mapT=0,introT=0;dolly.position.set(0,0,1.2);
renderer.setAnimationLoop((time,frame)=>{
  const dt=Math.min(0.05,clock.getDelta())||0.016,t=performance.now()/1000;
  if(arSession){if(frame)arFrame(frame);}
  else{if(!simOn){introT+=dt;yaw=Math.sin(introT*0.15)*0.3;camera.rotation.set(pitch,yaw,0,'YXZ');}else moveSim(dt);simHits();}
  trackPlayer(dt);clearUnderWalker();
  if(autoT>0){autoT-=dt;if(autoT<=0&&(simOn||arSession))resetStory();}
  updStory(dt);updGeo(dt);VOL=zoneMod().vol;
  const pr=present();pr.forEach(r=>r.step(dt,visitors));resolve();pr.forEach(r=>{r.pose(dt,t);r.look(dt,t);});
  sun.position.set(player.x+2,6,player.z+1);sun.target.position.set(player.x,0,player.z);sun.target.updateMatrixWorld();
  updAudio();
  mapT-=dt;if(mapT<=0){mapT=0.25;drawMap();updDebug();}
  renderer.render(scene,camera);
});
window.CONDITIONALS_AR={LOC,ZONES,onGeo,dolly,camera,rovers,ST,G,player,setYaw:(y,p)=>{yaw=y;pitch=p;},resetStory,setAct};
</script>
